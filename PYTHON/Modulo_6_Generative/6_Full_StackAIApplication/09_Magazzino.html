<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Giacenze</title>
</head>
<body>
  <h1>Ricerca giacenza</h1>

  <form method="get" action="{{ url_for('pagina_giacenza') }}">
    <label for="articolo">Codice articolo</label>
    <input id="articolo" name="articolo" value="{{ articolo }}" required>
    <button type="submit">Cerca</button>
  </form>

  {% if articolo %}
    {% if giacenza is none %}
      <p>Articolo {{ articolo }} non trovato.</p>
    {% else %}
      <p>La giacenza di {{ articolo }} è <strong>{{ giacenza }}</strong>.</p>
    {% endif %}
  {% endif %}
</body>
</html>
